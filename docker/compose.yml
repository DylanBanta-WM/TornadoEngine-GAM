# The GAM sidecar, started by Tornado Engine Core (see Core's docker/modules.yml).
services:
  gam:
    restart: unless-stopped
    build: .
    environment:
      # Optional: without it, the token the website made (storage/app/gam/sidecar-token) is used.
      GAM_SIDECAR_TOKEN: ${GAM_SIDECAR_TOKEN:-}
    volumes:
      - gam-config:/gam
      # The website's token for talking to GAM (made by this module's migration).
      - ../../../../storage/app/gam:/tornado:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # internal: only the website reaches it. edge: it reaches Google.
    networks: [internal, edge]

volumes:
  gam-config:

networks:
  internal:
    internal: true
  edge: {}
